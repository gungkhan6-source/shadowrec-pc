appId: com.novarec.studio
productName: NovaRec Studio
copyright: Copyright (C) 2026 NovaRec Studio
asar: true

directories:
  output: dist

win:
  target:
    - nsis
  requestedExecutionLevel: requireAdministrator
  publisherName: NovaRec Studio

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NovaRec Studio
  license: LICENSE.txt

files:
  - build/**/*
  - electron/**/*
  - native/**/*
  - package.json
  - node_modules/**/*
  - "!node_modules/**/test/**"
  - "!node_modules/**/*.md"
  - "!node_modules/**/*.ts"
  - "!node_modules/**/*.map"

extraResources:
  - from: bin/
    to: bin/
